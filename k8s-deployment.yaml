apiVersion: apps/v1
kind: Deployment
metadata:
  name: mycv-deployment
  labels:
    app: mycv
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mycv
  template:
    metadata:
      labels:
        app: mycv
    spec:
      containers:
      - name: mycv
        image: my-cv:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: mycv-service
spec:
  type: LoadBalancer
  selector:
    app: mycv
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
